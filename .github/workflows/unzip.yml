name: unpack-geeta-pages
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zips
        run: |
          shopt -s nullglob
          z=(geeta-book/pages/*.zip geeta-*.zip books-*.zip)
          if [ ${#z[@]} -eq 0 ]; then echo "no zips"; exit 0; fi
          for f in "${z[@]}"; do
            case "$f" in
              books-*) d=books ;;
              *) d=geeta-book/pages ;;
            esac
            mkdir -p "$d"
            unzip -o -q "$f" -d "$d"
            rm "$f"
          done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack zips"
          git push
